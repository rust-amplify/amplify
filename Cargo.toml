[package]
name = "amplify"
version = "5.0.0-beta.2"
description = "A unified facade for the Rust Amplify crate family"
authors = [
    "Dr. Maxim Orlovsky <orlovsky@ubideco.org>",
    "Martin Habovstiak <martin.habovstiak@gmail.com>",
]
keywords = ["generics", "core", "wrap", "patterns"]
categories = ["data-structures", "rust-patterns"]
repository = "https://github.com/rust-amplify/rust-amplify"
homepage = "https://github.com/rust-amplify"
license = "MIT"
readme = "README.md"
edition = "2021"
rust-version = "1.100.0"
exclude = [
    ".github",
]

[dependencies]
collections = { package = "collections-traits", version = "0.1.0", default-features = false }
confined = { version = "=0.5.0-beta.1", default-features = false }
amplify_derive = { version = "4.0.1", optional = true }
amplify_syn = { version = "2.0.1", optional = true }
amplify_num = { version = "=0.6.0-beta.1", default-features = false }
rand = { version = "0.9.1", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
stringly_conversions = { version = "0.1.1", optional = true, features = ["alloc"] }

[dev-dependencies]
serde_json = "1.0"

[features]
all = [
    "alloc",
    "serde",
    "std",
    "stringly_conversions",
    "c_raw",
    "proc_attr",
    "derive",
    "rand",
    "indexmap",
    "hashbrown",
    "heapless",
    "ascii",
    "ascii-serde",
    "hex",
]
default = ["std", "derive", "hex"]
alloc = ["amplify_num/alloc", "collections/alloc", "confined/alloc"]
std = ["alloc", "amplify_num/std", "collections/std", "confined/std", "serde?/std"]
rand = ["dep:rand"]
c_raw = ["std"]
hex = ["amplify_num/hex", "confined/hex"]
proc_attr = ["dep:amplify_syn"]
derive = ["dep:amplify_derive"]
indexmap = ["collections/indexmap", "confined/indexmap"]
hashbrown = ["collections/hashbrown", "confined/hashbrown"]
heapless = ["collections/heapless", "confined/heapless"]
ascii = ["collections/ascii", "confined/ascii"]
ascii-serde = ["serde", "confined/ascii-serde"]
stringly_conversions = ["dep:stringly_conversions"]
serde = ["dep:serde", "amplify_num/serde", "confined/serde"]
